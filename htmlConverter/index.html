<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Markdown to HTML Converter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>

  <body>
    <h1 id="welcome-head">Markdown to HTML Converter</h1>

    <!--Top container-->
    <div id="content-container" class="card">
      <label for="markdown-input" id="markdown-label">Markdown Input</label>
      <textarea
        id="markdown-input"
        placeholder="Type markdown...

Examples:

# Heading 1           |  > This is a blockquote example.
## Heading 2          |  ![Sample Image](https://via.placeholder.com/150)
### Heading 3         |  This paragraph contains **bold text** or __bold text__, *italic text* or _italic text_, and a link to [Google](https://google.com).
#### Heading 4        |   
##### Heading 5       |  This is a second line separated by a standard line break.
###### Heading 6      |  
"
      ></textarea>
      <button type="submit" id="submit-btn">Submit</button>
    </div>

    <!--Bottom container-->
    <div id="output-container">
      
      <!--Left output-->
      <div class="output-card card">
        <label id="raw-label" for="raw-output">Raw Output HTML</label>
        <textarea id="raw-output" placeholder="Raw HTML Output..." readonly></textarea>
      </div>

      <!--right output-->
      <div class="output-card card">
        <label id="html-view-label">HTML View</label>
        <div id="html-preview">HTML preview will appear here...</div>
      </div>

    </div>
  </body>
</html>
